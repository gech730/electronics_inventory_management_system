services:
  # ==============================================================================
  # Render Web Service (Dockerized Laravel Backend)
  # ==============================================================================
  - type: web
    name: ngus-electronics-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # or free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Ngus Electronics"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: ngus-electronics-api
          property: host
      - key: LOG_CHANNEL
        value: stderr
      - key: RUN_MIGRATIONS
        value: "true"

      # Database Configuration (Attach your Render PostgreSQL or external MySQL database)
      - key: DB_CONNECTION
        value: mysql # or pgsql if using Render Postgres
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306" # or 5432 for pgsql
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Cloudinary Storage Configuration
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false

      # Sanctum & Session Configuration
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
